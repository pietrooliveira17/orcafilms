<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Fio do Bigode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --background-color: #ffffff;
            --text-color: #015C91;
            --primary-color: black;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Roboto', sans-serif
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: var(--font-body);
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            font-family: var(--font-display);
            letter-spacing: 2px
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold var(--text-color)
        }

        nav a {
            margin-left: 2rem;
            font-size: 1.2rem;
            transition: color .3s
        }

        nav a:hover {
            color: var(--text-color)
        }

        .project-detail {
            padding-top: 100px
        }

        .project-hero {
            width: 100%;
            padding: 0 5%;
            margin-bottom: 4rem
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%
        }

        .project-hero img {
            width: 100%;
            height: auto;
            display: block
        }

        .project-info {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
            padding: 0 5%;
            margin-bottom: 5rem
        }

        .project-info h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 1.5rem
        }

        .project-info .synopsis {
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 300;
            max-width: 60ch;
            color: black;
        }

        .tech-details dt {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: .5rem;
            font-family: var(--font-display);
            letter-spacing: 1px
        }

        .tech-details dd {
            margin-left: 0;
            margin-bottom: 1.5rem;
            color: black;
        }

        .bts-gallery {
            padding: 0 5%;
            margin-bottom: 5rem
        }

        .bts-gallery h2 {
            font-family: var(--font-display);
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 2px
        }

        .bts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem
        }

        .bts-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px
        }

        @media (max-width:768px) {
            .project-info {
                grid-template-columns: 1fr
            }

            .project-info h1 {
                font-size: 3rem
            }
        }
    </style>
</head>

<body>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    <audio id="click-sound" src="click.mp3" preload="auto"></audio>

    <header>
        <a href="../index.html" class="logo interactive">ORCA FILMS</a>
        <nav>
            <a href="../index.html#filmes" class="interactive">Voltar aos Filmes</a>
        </nav>
    </header>

    <main>
        <article class="project-detail">
            <section class="project-hero">
                <div class="video-container">
                    <div style="padding:177.78% 0 0 0;position:relative;"><iframe
                            src="https://player.vimeo.com/video/1147851744?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                            width="1080" height="1920" frameborder="0"
                            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" title="Fio do Bigode"></iframe></script>
                        </script>
                    </div>
            </section>

            <section class="project-info">
                <div class="description">
                    <h1>Cinematic SC</h1>
                    <p class="synopsis">
                        Trabalho feito para uma barbearia de alta classe do Alto Tietê.
                    </p>
                </div>
                <aside class="tech-details">
                    <dl>
                        <div>
                            <dt>Diretor</dt>
                            <dd>Murillo Macedo</dd>
                        </div>
                        <div>
                            <dt>Cinematografia</dt>
                            <dd>Murillo Macedo</dd>
                        </div>
                        <div>
                            <dt>Ano</dt>
                            <dd>2025</dd>
                        </div>
                    </dl>
                </aside>
            </section>

        </article>
    </main>

</body>

</html>
