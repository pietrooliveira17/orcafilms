<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ORCA FILMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400&display=swap');

        :root {
            --background-color: #ffffff;
            --text-color: #000000;
            --primary-color: #f39c12;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Roboto', sans-serif
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            font-family: var(--font-display);
            letter-spacing: 2px;
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0))
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        nav a {
            margin-left: 2rem;
            font-size: 1.2rem;
            transition: color .3s;
            color: white;
        }

        nav a:hover {
            color: var(--text-color)
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            align-items: center;
            gap: 4rem;
            padding: 120px 5%;
        }

        .contact-info h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            color: #015C91;
        }

        .contact-info p {
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 300;
            max-width: 45ch;
            margin-bottom: 3rem;
        }

        .whatsapp-btn {
            background: BLACK;
            color: white;
            padding: 20px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 0;
            transition: 0.3s;
            font-family: var(--font-display);
            letter-spacing: 1px;
        }

        .whatsapp-btn:hover {
            background: #015C91;
        }

        @media (max-width: 900px) {
            .contact-container {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 100px;
            }

            .contact-info p {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">ORCA FILMS</a>
        <nav>
            <a href="index.html#filmes">Filmes</a>
            <a href="index.html#fotografias">Fotografias</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="contact-container">
        <section class="contact-info">
            <h1>Vamos Criar Algo Juntos!</h1>
            <p>Se você tem um projeto em mente, uma oportunidade de colaboração ou simplesmente quer dizer olá, entre em
                contato pelo nosso WhatsApp.</p>
            <div class="socials">
                <a href="https://wa.me/11932668079" class="whatsapp-btn">FALAR NO WHATSAPP</a>
            </div>
        </section>
    </main>
</body>

</html>
